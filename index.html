<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Buku Tamu Digital</title>
    <style>
        * { box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }
        .card {
            background: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 8px 20px rgba(0,0,0,0.1);
            width: 100%;
            max-width: 400px;
        }
        h2 {
            margin-top: 0;
            color: #333;
            text-align: center;
            margin-bottom: 20px;
        }
        .form-group {
            margin-bottom: 15px;
        }
        label {
            display: block;
            margin-bottom: 5px;
            color: #555;
            font-weight: 600;
        }
        input[type="text"], textarea {
            width: 100%;
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 6px;
            font-size: 14px;
        }
        textarea {
            resize: vertical;
            height: 80px;
        }
        button {
            width: 100%;
            background-color: #4f46e5;
            color: white;
            padding: 12px;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.2s;
        }
        button:hover {
            background-color: #4338ca;
        }
        #status {
            margin-top: 15px;
            text-align: center;
            font-size: 14px;
            font-weight: 500;
        }
    </style>
</head>
<body>

    <div class="card">
        <h2>Buku Tamu Digital</h2>
        <form id="guestbookForm">
            <div class="form-group">
                <label for="nama">Nama:</label>
                <input type="text" id="nama" name="nama" required placeholder="Masukkan nama kamu...">
            </div>
            <div class="form-group">
                <label for="pesan">Pesan:</label>
                <textarea id="pesan" name="pesan" required placeholder="Tulis pesan atau kesan..."></textarea>
            </div>
            <button type="submit" id="submitBtn">Kirim Pesan</button>
        </form>
        <div id="status"></div>
    </div>

    <script>
        // URL Aplikasi Web yang sudah digabungkan
        const scriptURL = 'https://script.google.com/macros/s/AKfycbyYRztFOme7AEAGwp3Vgmt-W9y-SjfsBpnvMMpEBKUqR2Q-JxZB_o3s1j68M8mFawVN/exec';

        const form = document.getElementById('guestbookForm');
        const submitBtn = document.getElementById('submitBtn');
        const statusDiv = document.getElementById('status');

        form.addEventListener('submit', e => {
            e.preventDefault();
            submitBtn.disabled = true;
            submitBtn.textContent = 'Mengirim...';
            statusDiv.style.color = '#555';
            statusDiv.textContent = 'Sedang mengirim data...';

            let requestBody = new FormData(form);

            fetch(scriptURL, { method: 'POST', body: requestBody })
                .then(response => {
                    statusDiv.style.color = 'green';
                    statusDiv.textContent = 'Terima kasih! Pesan berhasil dikirim.';
                    form.reset();
                    submitBtn.disabled = false;
                    submitBtn.textContent = 'Kirim Pesan';
                })
                .catch(error => {
                    statusDiv.style.color = 'red';
                    statusDiv.textContent = 'Gagal mengirim! Periksa kembali koneksi atau URL.';
                    submitBtn.disabled = false;
                    submitBtn.textContent = 'Kirim Pesan';
                    console.error('Error!', error.message);
                });
        });
    </script>

</body>
</html>
